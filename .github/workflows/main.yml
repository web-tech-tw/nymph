name: Main workflow

on:
  push:
    branches:
      - main
      - rolling

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    name: Build and publish a Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-service:
    name: Deploy application as service
    needs: build-and-push-image
    runs-on: ubuntu-latest

    steps:
      - name: Deploy main via Webhook
        if: github.ref_name == 'main'
        env:
          WEBHOOK_URL: ${{ vars._WEBHOOK_URL_PART_UP }}
          WEBHOOK_SECRET: ${{ secrets._WEBHOOK_SECRET_PART_UP }}
          WEBHOOK_DEPLOY_PATH: ${{ vars._WEBHOOK_DEPLOY_PATH_MAIN }}
        run: |
          curl --silent --show-error --fail -X POST \
            -H "X-Nymph-Stack-Secret: $WEBHOOK_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"path\": \"$WEBHOOK_DEPLOY_PATH\"}" \
            "$WEBHOOK_URL"

      - name: Deploy rolling via Webhook
        if: github.ref_name == 'rolling'
        env:
          WEBHOOK_URL: ${{ vars._WEBHOOK_URL_PART_UP }}
          WEBHOOK_SECRET: ${{ secrets._WEBHOOK_SECRET_PART_UP }}
          WEBHOOK_DEPLOY_PATH: ${{ vars._WEBHOOK_DEPLOY_PATH_ROLLING }}
        run: |
          curl --silent --show-error --fail -X POST \
            -H "X-Nymph-Stack-Secret: $WEBHOOK_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"path\": \"$WEBHOOK_DEPLOY_PATH\"}" \
            "$WEBHOOK_URL"
